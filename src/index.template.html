<title>Ynmo Roadmaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap">
<script src="vendor/supabase-js.js"></script>
<style>
{{STYLES}}</style>

<div class="gate" id="gate" hidden></div>
<div id="shell" class="app-hidden">
<aside class="rail" aria-label="Main">
  <div class="brand"><img class="logo" id="toplogo" alt="Ynmo"></div>
  <nav class="nav" id="nav" aria-label="Pages"></nav>
</aside>
<header class="topbar">
  <div class="ptitle"><small>Ynmo Roadmaps</small><b id="ptitle">Roadmap</b></div>
  <div class="spacer"></div>
  <button class="avbtn" id="avbtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu"></button>
</header>
<div class="umenu" id="umenu" role="menu" hidden></div>
<main>
<section class="pg page" id="pg-roadmap">
  <header class="pghead">
    <div>
      <h1 id="rmtitle">Roadmap</h1>
      <p class="sub">Double-click a bar to rename it. Right-click for options. Drag to move or resize, or drop a bar on another person to hand it over. Double-click an empty spot in a row to insert a bar.</p>
    </div>
  </header>

  <div class="summary" id="summary" aria-live="polite"></div>

  <div class="controls" role="group" aria-label="Filters">
    <span id="chips" style="display:contents"></span>
    <label class="sr" for="status">Status</label>
    <select id="status">
      <option value="all">All statuses</option>
      <option value="planned">Planned</option>
      <option value="decide">Needs decision</option>
      <option value="contract">Waiting on contract</option>
      <option value="done">Done</option>
    </select>
    <label class="sr" for="person">Person</label>
    <select id="person"><option value="all">Everyone</option></select>
    <label class="sr" for="q">Search</label>
    <input type="search" id="q" placeholder="Search features">
    <button class="btn" id="clear" type="button">Clear filters</button>
  </div>

  <div class="toolbar">
    <label class="sr" for="rmsel">Roadmap</label><select id="rmsel"></select>
    <button class="btn primary" id="add" type="button">New feature</button>
    <button class="btn" id="undo" type="button" disabled>Undo</button>
    <button class="btn" id="addnote" type="button" title="Add a note to the timeline, such as leave or full-stack focus">Add note</button>
    <button class="btn" id="daysoff" type="button">Days off</button>
    <button class="btn" id="ideasbtn" type="button">Ideas</button>
    <label class="sr" for="zoom">Zoom</label>
    <select id="zoom"><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option></select>
    <button class="btn" id="exportpdf" type="button" title="A coloured, full-timeline PDF to send to executives">Export PDF</button>
    <span class="save" id="save" aria-live="polite"></span>
  </div>

  <div class="legend" aria-label="Legend">
    <span><i class="sw st-planned"></i>Planned</span>
    <span><i class="sw st-decide"></i>Needs decision or clarification</span>
    <span><i class="sw st-contract"></i>Waiting on Support contract</span>
    <span><i class="sw st-done"></i>Done</span>
  </div>

  <div class="chartwrap" id="wrap"><div class="grid" id="grid"></div></div>
</section>
<section class="pg page" id="pg-ideas" hidden></section>
<section class="pg page" id="pg-roadmaps" hidden></section>
<section class="pg page" id="pg-sprints" hidden></section>
<section class="pg page" id="pg-reports" hidden></section>
<section class="pg page" id="pg-resources" hidden></section>
<section class="pg page" id="pg-vacations" hidden></section>
<section class="pg page" id="pg-capacity" hidden></section>
<section class="pg page" id="pg-baselines" hidden></section>
<section class="pg page" id="pg-log" hidden></section>
<section class="pg page" id="pg-admin" hidden></section>
</main>
<aside class="drawer" id="drawer" hidden aria-label="Ideas backlog"></aside>
</div>

<div class="ctx" id="ctx" role="menu" hidden></div>
<div class="pop" id="pop" role="dialog" aria-label="Assign team members" hidden></div>

<script>
{{SCRIPTS}}</script>

</html>
