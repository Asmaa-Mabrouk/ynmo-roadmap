<meta charset="utf-8">
<title>Ynmo Roadmaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap">

<style>
/* Layout: a planner table (feature, resources, status) on the left with collapsible squad groups, 18 weekly columns on the right (Oct 2026 to Jan 2027). Bar fill = squad or chosen color, bar pattern = status. */
:root {
  --bg: #faf9f5;
  color-scheme: light;
  --surface: #ffffff;
  --surface-2: #eceef6;
  --ink: #1b1f33;
  --muted: #5a6180;
  --line: #dcdfeb;
  --focus: #0d8560;
  --brand: #0d8560; --brand-2: #6d48a8; --brand-soft: #18b087;
  --on-bar: #ffffff;
  --tifli: #563cca;
  --plan: #0d8560;
  --daycare: #5a6db5;
  --ai: #c04a17;
  --warn: #9a6400;
  --p1: #2f6fb3; --p2: #0d8560; --p3: #9a6400; --p4: #b83280; --p5: #5a6180; --p6: #c04a17;
  --font: "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Cairo", system-ui, sans-serif;
  --c1: 210px; --dw: 26px; --wkend: color-mix(in srgb, var(--ink) 7%, transparent);
}
@media (max-width: 640px) { :root { --c1: 150px; } }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4; }
.page { max-width: none; margin: 0; padding-inline: 12px; padding-block: 24px 48px; display: grid; gap: 16px; }
h1 { font-size: 1.75rem; line-height: 1.15; margin: 0; font-weight: 700; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 78ch; }
.summary { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; font-variant-numeric: tabular-nums; }
.summary b { font-family: var(--mono); font-weight: 500; font-size: 1.05rem; }
.summary span { color: var(--muted); }
.controls, .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chip { font: inherit; font-weight: 500; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.chip i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); display: inline-block; }
.chip[aria-pressed="false"] { opacity: .5; }
.chip[aria-pressed="true"] { border-color: var(--c); }
select, input[type="search"], input[type="text"], textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 0; }
input[type="search"] { width: 180px; max-width: 100%; }
.btn { font: inherit; font-weight: 600; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn.primary { background: var(--focus); border-color: var(--focus); color: var(--on-bar); }
.btn.danger { color: var(--warn); border-color: var(--warn); }
.btn:disabled, select:disabled, input:disabled, textarea:disabled { opacity: .55; cursor: not-allowed; }
.save { color: var(--muted); font-size: 12.5px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 12.5px; align-items: center; }
.legend span { display: inline-flex; gap: 8px; align-items: center; }
.sw { width: 34px; height: 14px; border-radius: 4px; display: inline-block; --c: var(--muted); }
.st-planned { background: var(--c); color: var(--on-bar); }
.st-decide { background: repeating-linear-gradient(135deg, var(--c) 0 6px, color-mix(in srgb, var(--c) 78%, var(--ink)) 6px 12px); color: var(--on-bar); }
.st-contract { background: transparent; border: 2px dashed var(--c); color: var(--c); }
.st-done { background: color-mix(in srgb, var(--c) 30%, var(--surface)); color: var(--ink); }

.chartwrap { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 88vh; }
.grid { display: grid; grid-template-columns: var(--c1) repeat(123, var(--dw)); width: max-content; min-width: 100%; }
.hc, .mh, .wk { background: var(--surface-2); border-bottom: 1px solid var(--line); position: sticky; z-index: 5; color: var(--muted); font-size: 11.5px; font-weight: 600; }
.hc { padding: 0 12px; display: flex; align-items: center; letter-spacing: .05em; text-transform: uppercase; }
.hc.r1 { top: 0; height: 30px; text-transform: none; letter-spacing: 0; }
.hc.r2 { top: 30px; height: 28px; }
.hc.first { left: 0; z-index: 8; }
.mh { top: 0; height: 30px; padding: 0 8px; display: flex; align-items: center; gap: 6px; white-space: nowrap; border-inline-start: 1px solid var(--line); color: var(--ink); }
.mh small { color: var(--warn); font-weight: 500; font-size: 10.5px; }
.wk { top: 30px; height: 28px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 10.5px; font-weight: 400; border-inline-start: 1px solid var(--line); }
.wk.we { background: color-mix(in srgb, var(--ink) 12%, var(--surface-2)); }
.wk.offd { background: color-mix(in srgb, var(--warn) 30%, var(--surface-2)); color: var(--ink); }
.mh > span { position: sticky; left: calc(var(--c1) + 12px); }
.wk.today { background: var(--focus); color: var(--on-bar); font-weight: 500; }
.grp { position: sticky; left: 0; z-index: 4; background: var(--surface-2); border: 0; border-bottom: 1px solid var(--line); font: inherit; color: var(--ink); text-align: start; padding: 8px 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-weight: 700; }
.grp i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); flex: none; }
.grp em { font-style: normal; font-weight: 400; color: var(--muted); font-family: var(--mono); font-size: 12px; }
.grp .car { font-family: var(--mono); color: var(--muted); width: 10px; }
.gfill { background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 8px 8px; color: var(--muted); font-size: 12px; grid-column: 2 / 4; display: flex; align-items: center; }
.gbg { background: var(--surface-2); border-bottom: 1px solid var(--line); grid-column: 4 / -1; }
.gsum { align-self: center; height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--c) 55%, var(--surface-2)); margin-inline: 2px; z-index: 1; }
.c1, .c2, .c3 { border-bottom: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; min-width: 0; }
.c1 { position: sticky; left: 0; z-index: 4; padding: 3px 4px 3px 6px; gap: 2px; border-inline-end: 1px solid var(--line); }
.c1.sel { background: color-mix(in srgb, var(--focus) 10%, var(--surface)); }
.c2 { padding: 3px 6px; }
.c3 { padding: 3px 6px; }
textarea.nm { flex: 1; min-width: 0; resize: none; overflow: hidden; border: 1.5px solid transparent; background: transparent; padding: 6px 8px; font-weight: 500; line-height: 1.3; height: 34px; }
textarea.nm:hover:not(:disabled), textarea.nm:focus { border-color: var(--line); background: var(--surface); }
.more { flex: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 16px; line-height: 1; border-radius: 6px; padding: 6px 7px; cursor: pointer; }
.more:hover { background: var(--surface-2); color: var(--ink); }
.res { width: 100%; text-align: start; font: inherit; color: var(--ink); background: transparent; border: 1.5px dashed transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res:hover:not(:disabled) { border-color: var(--line); background: var(--surface); }
.res.none { color: var(--muted); }
.stsel { width: 100%; font-size: 12.5px; font-weight: 600; padding: 5px 6px; }
.stsel[data-st="decide"] { color: var(--warn); border-color: var(--warn); }
.stsel[data-st="contract"] { border-style: dashed; color: var(--muted); }
.stsel[data-st="done"] { color: var(--plan); }
.rowbg { grid-column: 2 / -1; border-bottom: 1px solid var(--line);
  background-image: linear-gradient(to right, transparent calc(100% - 1px), color-mix(in srgb, var(--line) 75%, transparent) calc(100% - 1px)), linear-gradient(to right, transparent 0, transparent calc(5 * var(--dw)), var(--wkend) calc(5 * var(--dw)), var(--wkend) calc(7 * var(--dw)));
  background-size: var(--dw) 100%, calc(7 * var(--dw)) 100%; background-position: 0 0, var(--sh, calc(-4 * var(--dw))) 0; background-repeat: repeat-x; }
.off { z-index: 0; pointer-events: none; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--warn) 24%, transparent) 0 6px, transparent 6px 12px); border-inline: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); }
.pb { align-self: start; height: 30px; min-height: 0; margin-block-end: 0; padding-block: 2px; }
.pb .nm2 { -webkit-line-clamp: 1; }
.drop { background-color: color-mix(in srgb, var(--focus) 12%, var(--surface)); }
.gbg.drop, .grp.drop { background-color: color-mix(in srgb, var(--focus) 22%, var(--surface-2)); }
.bar { --c: var(--muted); position: relative; align-self: stretch; margin: 5px 2px; min-height: 32px; border-radius: 6px; font-size: 12px; line-height: 1.25; font-weight: 600; padding: 4px 11px; display: flex; align-items: center; z-index: 1; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
.bar.ro { cursor: pointer; touch-action: auto; }
.bar .nm2 { position: sticky; left: calc(var(--c1) + 14px); min-width: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bar .tg { flex: none; font-size: 10px; font-weight: 700; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-inline-start: 6px; opacity: .9; }
.bar[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.bar.dragging { cursor: grabbing; z-index: 7; box-shadow: 0 8px 22px rgba(10, 12, 30, .3); opacity: .94; }
.hd { position: absolute; top: 0; bottom: 0; width: 10px; cursor: ew-resize; }
.hd.l { left: 0; } .hd.r { right: 0; }
.hd::after { content: ""; position: absolute; top: 30%; bottom: 30%; left: 4px; width: 2px; border-radius: 2px; background: currentColor; opacity: .5; }
.bar.ro .hd { display: none; }
.detail { grid-column: 1 / -1; border-bottom: 1px solid var(--line); background: var(--bg); padding: 14px 12px 18px; }
.detail-in { position: sticky; left: 12px; width: min(920px, calc(100vw - 72px)); display: grid; gap: 12px; }
.detail p { margin: 0; max-width: 75ch; }
.detail ul { margin: 0; padding-inline-start: 18px; max-width: 80ch; display: grid; gap: 4px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.fields .wide { grid-column: 1 / -1; }
.fields label > span, .lab { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
.fields input, .fields select, .fields textarea { width: 100%; }
.fields textarea { resize: vertical; min-height: 56px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: var(--c); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface) inset; }
.swatch.def { background: repeating-linear-gradient(45deg, var(--surface) 0 4px, var(--surface-2) 4px 8px); }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 16px; margin: 0; }
.roles div { min-width: 0; }
.roles dt { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.roles dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.meta { color: var(--muted); font-size: 12.5px; }
.cf { color: var(--warn); }
.empty { padding: 32px 16px; color: var(--muted); grid-column: 1 / -1; }
.notes { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 8px; }
.notes h2 { margin: 0; font-size: 1.05rem; }
.notes ul { margin: 0; padding-inline-start: 18px; display: grid; gap: 6px; max-width: 90ch; }
.sr { position: absolute; left: -9999px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-weight: 600; padding: 6px 14px; background: var(--surface); color: var(--muted); border: 0; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--focus); color: var(--on-bar); }
.grid.hov .bar:not(.same) { opacity: .35; }
.bar.same { box-shadow: 0 0 0 2px var(--ink); }
.pn i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-inline-end: 8px; }
.pn { flex-direction: column; align-items: flex-start; justify-content: center; padding: 8px 12px; gap: 2px; font-weight: 600; }
.pn small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.c2.pi, .c3.pi { flex-direction: column; align-items: flex-start; justify-content: center; padding: 8px 10px; font-size: 12.5px; color: var(--muted); gap: 2px; }
.c3.pi b { color: var(--ink); font-weight: 600; }
.c3.pi .warnx { color: var(--warn); font-weight: 600; }
.ov { background: color-mix(in srgb, var(--warn) 11%, transparent); z-index: 0; pointer-events: none; }
.rbtn { width: 100%; text-align: start; }
.pop { position: fixed; z-index: 50; width: min(320px, calc(100vw - 16px)); max-height: min(440px, 70vh); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 34px rgba(10, 12, 30, .28); padding: 12px; display: grid; gap: 10px; }
.ctx { position: fixed; z-index: 60; width: 232px; max-height: 92vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 34px rgba(10,12,30,.25); padding: 6px; }
.ctx[hidden] { display: none; }
.mi { display: block; width: 100%; text-align: start; border: 0; background: transparent; font: inherit; color: var(--ink); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.mi:hover, .mi:focus-visible { background: var(--surface-2); }
.mi.danger { color: var(--warn); }
.msep { height: 1px; background: var(--line); margin: 5px 0; }
.mlab { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 6px 10px 2px; }
.mrow { display: flex; gap: 6px; padding: 4px 10px; flex-wrap: wrap; }
.mrow input[type=date] { width: 100%; font-size: 12.5px; padding: 4px 6px; }
.bar.editing { z-index: 9; cursor: text; overflow: visible; }
.bi { font: inherit; font-weight: 600; color: var(--ink); background: var(--surface); border: 2px solid var(--focus); border-radius: 5px; padding: 1px 6px; width: max(100%, 220px); position: sticky; left: calc(var(--c1) + 10px); }
.addrow { border-bottom: 1px solid var(--line); }
.addp { font: inherit; font-weight: 600; color: var(--focus); background: transparent; border: 1.5px dashed var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.addp:hover { border-color: var(--focus); }
.gate { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: 16px; }
.gate[hidden] { display: none; }
.gcard { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 12px; box-shadow: 0 8px 30px rgba(10,12,30,.08); }
.gcard h2 { margin: 0; font-size: 1.25rem; }
.gcard label > span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
.gcard input { width: 100%; }
.pwwrap { position: relative; }
.pwwrap input { padding-inline-end: 60px; }
.pweye { position: absolute; inset-block: 3px; inset-inline-end: 3px; border: 0; background: var(--surface-2); color: var(--ink); font: inherit; font-size: 12.5px; font-weight: 600; padding: 0 10px; border-radius: 6px; cursor: pointer; }
.gerr { color: var(--warn); font-size: 13px; min-height: 1.2em; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--focus); cursor: pointer; text-align: start; }
.who { color: var(--muted); font-size: 12.5px; }
.app-hidden { display: none; }
.pop[hidden] { display: none; }
.pop h3 { margin: 0; font-size: 14px; }
.pop .sub2 { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.pop input[type="search"], .pop input[type="text"] { width: 100%; }
.plist { display: grid; gap: 2px; max-height: 150px; overflow: auto; }
.prow { display: flex; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
.prow:hover { background: var(--surface-2); }
.prow input { flex: none; width: 16px; height: 16px; accent-color: var(--focus); }
.prow span { min-width: 0; overflow-wrap: anywhere; }
.prow small { color: var(--muted); display: block; font-size: 11.5px; }
.padd { display: grid; grid-template-columns: 1fr auto; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.padd select { grid-column: 1; }
.padd .lab { grid-column: 1 / -1; margin: 0; }
/* ===== YNMO look: Cairo, Ynmotomic green, logo ===== */
body { font-family: var(--font); }
.summary b, .wk, .mono { font-family: var(--font); font-variant-numeric: tabular-nums; }
.topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 18px; padding: 8px 16px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; color: var(--ink); text-decoration: none; white-space: nowrap; }
.logo { width: 34px; height: 34px; display: block; }
.brand small { color: var(--muted); font-weight: 500; font-size: 12px; display: block; line-height: 1; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.nav button { position: relative; font: inherit; font-weight: 600; color: var(--muted); background: transparent; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); }
.nav .dot { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--warn); color: #fff; font-size: 10.5px; line-height: 16px; text-align: center; padding: 0 4px; }
.spacer { flex: 1; }
.avbtn { border: 2px solid var(--line); background: var(--surface); border-radius: 50%; width: 42px; height: 42px; padding: 0; cursor: pointer; display: grid; place-items: center; overflow: hidden; }
.avbtn:hover, .avbtn[aria-expanded="true"] { border-color: var(--brand); }
.av { display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden; flex: none; background: var(--surface-2); color: var(--ink); font-weight: 700; }
.av svg { width: 100%; height: 100%; display: block; }
.umenu { position: fixed; top: 58px; right: 12px; z-index: 70; width: 260px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 34px rgba(10,12,30,.2); padding: 10px; display: grid; gap: 4px; }
.umenu[hidden] { display: none; }
.umenu .who2 { display: flex; gap: 10px; align-items: center; padding: 6px 6px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.umenu .who2 b { display: block; }
.umenu .who2 small { color: var(--muted); display: block; overflow-wrap: anywhere; }
.pg[hidden] { display: none; }
.page { max-width: none; }
.pghead { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; justify-content: space-between; }
.pghead h1 { margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.card h2, .card h3 { margin: 0; font-size: 1.05rem; }
.formrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.formrow label > span { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: start; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tscroll { overflow-x: auto; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; background: var(--surface); color: var(--ink); cursor: default; }
button.pill { cursor: pointer; }
.pill[aria-pressed="true"] { border-color: var(--c, var(--brand)); background: color-mix(in srgb, var(--c, var(--brand)) 12%, var(--surface)); }
.pill i { width: 9px; height: 9px; border-radius: 3px; background: var(--c, var(--muted)); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 7px; background: var(--surface-2); color: var(--muted); }
.badge.ok { background: color-mix(in srgb, var(--brand) 14%, var(--surface)); color: var(--brand); }

function parseIso(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; }

function logoEl() { const i = document.createElement('img'); i.className = 'logo'; i.src = LOGO; i.alt = 'Ynmo'; return i; }
function makeDb() {
  const err = e => { const x = new Error((e && e.message) || 'error'); x.code = (e && (e.code === '42501' || /row-level/i.test(e.message || ''))) ? 'invalid_argument' : ((e && e.code) || 'error'); return x; };
  const load = async t => {
    let q = sb.from(t).select('id,data');
    if (t === 'activity') q = q.order('updated_at', { ascending: false }).limit(300);
    const r = await q; if (r.error) throw err(r.error);
    return { docs: r.data.map(x => ({ id: x.id, data: () => x.data || {} })) };
  };
  return {
    doc(path) {
      const p = path.split('/'), t = p[0], id = p[1];
      return {
        async set(d) { const r = await sb.from(t).upsert({ id: id, data: d }); if (r.error) throw err(r.error); },
        async delete() { const r = await sb.from(t).delete().eq('id', id); if (r.error) throw err(r.error); }
      };
    },
    collection(t) {
      return {
        get: () => load(t),
        onSnapshot(cb, ecb) {
          const run = () => load(t).then(cb).catch(e => { if (ecb) ecb(e); });
          run();
          sb.channel('rt-' + t).on('postgres_changes', { event: '*', schema: 'public', table: t }, run).subscribe();
          setInterval(run, 30000);
        }
      };
    }
  };
}

  $('clear').addEventListener('click', () => {
    state.sq = new Set(LANES.map(l => l.k)); state.status = 'all'; state.person = 'all'; state.q = '';
    $('status').value = 'all'; $('person').value = 'all'; $('q').value = '';
    chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'true')); render();
  });
  const gr = $('grid');
  gr.addEventListener('contextmenu', e => {
    if (!canEdit()) return;
    const bar = e.target.closest('.bar');
    if (bar) {
      const it = items().find(i => i.id === bar.dataset.id);
      if (it) { e.preventDefault(); barMenu(it, bar.dataset.person, e.clientX, e.clientY); }
      return;
    }
    const row = e.target.closest('.rowbg[data-person], .c1.pn');
    if (row) { e.preventDefault(); rowMenu(row.dataset.person, e.clientX, e.clientY, row.classList.contains('rowbg') ? dayAt(e.clientX) : (todayK >= 0 ? todayK : 0)); }
  });
  gr.addEventListener('dblclick', e => {
    if (!canEdit() || e.target.tagName === 'INPUT') return;
    const bar = e.target.closest('.bar');
    if (bar) { const it = items().find(i => i.id === bar.dataset.id); if (it) startEdit(it, bar.dataset.person); return; }
    const row = e.target.closest('.rowbg[data-person]');
    if (row) addAt(row.dataset.person, dayAt(e.clientX));
  });
  $('wrap').addEventListener('scroll', closeCtx);
  window.addEventListener('resize', closeCtx);
  document.addEventListener('pointerdown', e => { const c = $('ctx'); if (!c.hidden && !c.contains(e.target)) closeCtx(); }, true);
  $('add').addEventListener('click', () => { if (canEdit()) addItem(); });
  $('undo').addEventListener('click', undo);
  $('daysoff').addEventListener('click', e => openOff(e.currentTarget));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeCtx(); if (picker || offOpen) closePicker(); }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
      const t = e.target && e.target.tagName;
      if (t === 'TEXTAREA' || t === 'INPUT' || t === 'SELECT') return;
      e.preventDefault(); undo();
    }
  });
  let armed = false, t2 = 0; const rb = $('reset');
  rb.addEventListener('click', () => {
    if (!canEdit()) return;
    if (armed) { armed = false; rb.textContent = 'Restore roadmap'; restoreAll(); return; }
    armed = true; rb.textContent = 'Click again to restore'; clearTimeout(t2); t2 = setTimeout(() => { armed = false; rb.textContent = 'Restore roadmap'; }, 3500);
  });
  render();
  $('export').addEventListener('click', exportCsv);
  $('toplogo').src = LOGO;
  const av = $('avbtn'), um = $('umenu');
  av.addEventListener('click', e => { e.stopPropagation(); um.hidden = !um.hidden; av.setAttribute('aria-expanded', String(!um.hidden)); });
  document.addEventListener('pointerdown', e => { if (!um.hidden && !um.contains(e.target) && !av.contains(e.target)) { um.hidden = true; av.setAttribute('aria-expanded', 'false'); } });
  $('rmsel').addEventListener('change', e => useRoadmap(e.target.value));
  try { const z = localStorage.getItem('ynmo-zoom'); if (ZOOM[z]) { state.zoom = z; $('zoom').value = z; } } catch (e) { /* storage unavailable */ }
  $('zoom').addEventListener('change', e => { state.zoom = e.target.value; try { localStorage.setItem('ynmo-zoom', state.zoom); } catch (x) { /* storage unavailable */ } render(); });
  $('today').addEventListener('click', () => { if (todayK < 0) { toast('Today is outside this roadmap.'); return; } const w = $('wrap'); w.scrollLeft = Math.max(0, (todayK - 3) * (ZOOM[state.zoom] || 26)); });
  $('ideasbtn').addEventListener('click', () => { drawerOpen = !drawerOpen; renderDrawer(); });
  const rowAt = e => document.elementsFromPoint(e.clientX, e.clientY).find(x => x.matches && x.matches('.rowbg[data-person]')) || null;
  const clearDrop = () => gr.querySelectorAll('.drop').forEach(x => x.classList.remove('drop'));
  gr.addEventListener('dragover', e => { if (!e.dataTransfer || ![...e.dataTransfer.types].includes('text/idea')) return; clearDrop(); const r = rowAt(e); if (r) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; r.classList.add('drop'); } });
  gr.addEventListener('dragleave', e => { if (!gr.contains(e.relatedTarget)) clearDrop(); });
  gr.addEventListener('drop', e => { const id = e.dataTransfer && e.dataTransfer.getData('text/idea'); const r = rowAt(e); clearDrop(); if (!id || !r) return; e.preventDefault(); scheduleIdea(id, r.dataset.person, dayAt(e.clientX), 14); });
  boot();
}
init();
</script>
